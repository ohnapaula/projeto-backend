services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: store
      MYSQL_USER: store
      MYSQL_PASSWORD: store
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend_net

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: store
      DB_USER: store
      DB_PASSWORD: store
      DATABASE_URL: mysql://store:store@mysql:3306/store
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend_net
    volumes:
      - uploads_data:/app/uploads

networks:
  backend_net:
    driver: bridge

volumes:
  mysql_data:
  uploads_data:
